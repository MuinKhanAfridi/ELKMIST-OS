# =====================================================================
#  extruder_profiles.ini  -  the extruders ELKMIST OS knows about
# =====================================================================
#  * The customer picks ONE of these during installation. The choice is
#    stored in ~/printer_data/config/machine.local.ini  ([extruder] model = ...).
#  * Each profile only holds what belongs to the extruder itself:
#        rotation_distance  filament mm per motor turn (Klipper value)
#        gear_ratio         only if the maker's Klipper config uses one
#        run_current        motor current in amps RMS (manufacturer value)
#  * UNSET = we do not have a confirmed value. The extruder stays OFF
#    until you fill it in here, or in machine.ini under [extruder]
#    (a value written in machine.ini [extruder] always wins over the profile).
#  * Pins, hotend (Rapido), sensor, drivers: NOT here. Those stay in machine.ini
#    and are the same for every extruder.
#  * To add an extruder: copy one block, give it a new name in [BRACKETS]
#    (capital letters, no spaces), fill in the values.
#  * The first block (LGX) is the main one. The final list of 10 can change.
#  * Values were taken from manufacturer documents (see 'source').
#    ALWAYS finish with the 100 mm calibration (docs/COMMISSIONING.md, step 7).
# =====================================================================

[LGX]
title = Bondtech LGX (Large Gears eXtruder)
vendor = Bondtech
origin = Sweden
rotation_distance = 8
run_current = 0.45
source = Bondtech LGX specification: e-steps 400 at 1/16 (200*16/400 = 8); motor 0.45-0.60 A RMS (starting at the lower value)
note = Use rotation_distance 8 WITHOUT gear_ratio. Bondtech lists 44:14, 37:17 for information only.

[LGX_LITE]
title = Bondtech LGX Lite (v1)
vendor = Bondtech
origin = Sweden
rotation_distance = 5.7
run_current = 0.45
source = Bondtech LGX Lite specification: e-steps 562 at 1/16 (200*16/562 = 5.7); motor 0.45-0.65 A, 750 mA max at 120 C (starting at the lower value)
note = Keep the motor cool enough to touch. Lower the current if it gets hot.

[LGX_LITE_V2]
title = Bondtech LGX Lite V2
vendor = Bondtech
origin = Sweden
rotation_distance = 5.7
run_current = UNSET
source = Bondtech LGX Lite V2 quick start (Creality Ender-7): rotation_distance 5.7
note = Motor current for the V2 was not confirmed. Read it in the manual that comes with your extruder and enter it here.

[LGX_LITE_PRO]
title = Bondtech LGX Lite PRO
vendor = Bondtech
origin = Sweden
rotation_distance = 3.99
run_current = 0.6
source = Bondtech LGX Lite PRO quick start: rotation_distance 3.99, run_current 0.6 (Nema14 motor)
note = Bondtech's Voron V0.2 kit guide rounds the value to 4. Final value comes from the 100 mm test.

[LGX_PRO]
title = Bondtech LGX PRO (1.75 mm)
vendor = Bondtech
origin = Sweden
rotation_distance = 7.805
run_current = 0.7
source = Bondtech LGX PRO quick setup: Klipper rotation_distance 7.805 (1.75 mm), run current 700-1000 mA RMS, 1 A RMS maximum (starting at the lower value)
note = The 2.85 mm version uses 7.356. Not used here (filament_diameter is 1.75).

[BMG]
title = Bondtech BMG
vendor = Bondtech
origin = Sweden
rotation_distance = 7.7108
run_current = UNSET
source = Bondtech: e-steps 415 at 1/16 (200*16/415 = 7.7108), gear ratio 50:17 already included in this value
note = The motor is not included with the BMG. Enter the current from the datasheet of the motor you use.

[DDX_V3]
title = Bondtech DDX V3
vendor = Bondtech
origin = Sweden
rotation_distance = 7.7108
run_current = UNSET
source = Bondtech: e-steps 415 at 1/16 for BMG / DDX (200*16/415 = 7.7108)
note = The motor is not included. Enter the current from the datasheet of the motor you use.

[HEMERA]
title = E3D Hemera
vendor = E3D
origin = United Kingdom
rotation_distance = 7.824
run_current = UNSET
source = E3D Hemera firmware guide: 409 e-steps at 1/16 (200*16/409 = 7.824)
note = Some users measured about 397.5 e-steps (rotation_distance 8.05). Do the 100 mm test. Current: take it from E3D's Hemera current guide. Check that E3D still sells it before you offer it.

[ORBITER_V2]
title = LDO Orbiter v2.0
vendor = LDO Motors
origin = China
rotation_distance = 4.637
run_current = UNSET
source = LDO Orbiter v2.0 firmware sheet: 690 steps/mm at 1/16 (200*16/690 = 4.637)
note = LDO lists 0.85 A for its Klipper example, but the same LDO motor is run at 0.45-0.65 A by Bondtech. Start low (about 0.6 A) and raise only if steps are lost.

[SHERPA_MINI]
title = Annex Engineering Sherpa Mini
vendor = Annex Engineering
origin = USA
rotation_distance = 22.67895
gear_ratio = 50:8
run_current = UNSET
source = Annex Klipper config block for the Sherpa Mini (8-tooth motor gear), read through a Duet forum quote; not re-checked on GitHub
note = Uses gear_ratio together with rotation_distance. If you override rotation_distance in machine.ini, keep the gear_ratio. NEMA14 motor: enter its current from the datasheet.
