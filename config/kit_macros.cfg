# kit_macros.cfg - installed by the printer kit (overwritten on update).
# Put your own macros in user_overrides.cfg instead.

# Called by the first line of every sliced file:
#   START_PRINT BED=60 EXTRUDER=210
[gcode_macro START_PRINT]
description: Heat, home and get ready to print
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% set ext = params.EXTRUDER|default(200)|float %}
    # pre-heat (bed first, nozzle to 150 so it does not ooze while the bed warms)
    {% if 'heater_bed' in printer and bed > 0 %}
        M140 S{bed}
    {% endif %}
    {% if 'extruder' in printer %}
        M104 S{[ext, 150]|min}
    {% endif %}
    G28
    {% if 'heater_bed' in printer and bed > 0 %}
        M190 S{bed}
    {% endif %}
    {% if 'extruder' in printer %}
        M109 S{ext}
    {% endif %}
    G90
    M83
    G92 E0

# Called by the last line of every sliced file.
[gcode_macro END_PRINT]
description: Cool down and lift the nozzle away from the print
gcode:
    M400
    {% if 'extruder' in printer %}
        M104 S0
    {% endif %}
    {% if 'heater_bed' in printer %}
        M140 S0
    {% endif %}
    M107
    {% if 'extruder' in printer and printer.extruder.can_extrude %}
        G91
        G1 E-2 F1800
    {% endif %}
    G91
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    {% set zpos = printer.toolhead.position.z|float %}
    {% set lift = [10.0, zmax - zpos]|min %}
    {% if lift > 0 %}
        G1 Z{lift} F600
    {% endif %}
    G90
