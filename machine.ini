# =====================================================================
#  machine.ini  -  THE ONLY FILE YOU NEED TO EDIT
# =====================================================================
#  * Every value marked  UNSET  is information we still need.
#  * Fill them in one by one. Save. Then run:   ./update.sh
#    (it rebuilds printer.cfg + slicer profile and restarts Klipper)
#  * Until ALL required motion values are filled in, the printer starts in
#    "SAFE MODE" (no motors, no heaters) so nothing can move or heat by
#    accident. Mainsail will still open and connect.
#  * Lines starting with # are comments. Do not remove the [sections].
#  * Pin names for the Arduino Due use the chip names: PA0 ... PD10.
#    (Not the Arduino "D22" names. Ask the PCB designer for the chip pin names.)
# =====================================================================

[general]
printer_name = ELKMIST OS                # machine name shown on screen. Write it WITHOUT quotes
# Where this kit lives on GitHub (used for the one-click update in Mainsail)
kit_repo_url = https://github.com/YOUR-ORG/YOUR-REPO.git
kit_branch = main

# ---------------------------------------------------------------------
[mcu]
# How the Raspberry Pi talks to the Arduino Due:
#   serial = Due "Programming" USB port (one cable does flashing AND running)  <- default
#   usb    = Due "Native" USB port (flash via Programming port, run via Native port)
comm = serial
# "auto" = find the Due automatically after it has been flashed.
# Or paste the full path, e.g. /dev/serial/by-id/usb-Arduino_...-if00
serial = auto

# ---------------------------------------------------------------------
[drivers]
# IMPORTANT: Klipper (Oct 2026) has NO built-in [tmc5240] support.
# The closest is [tmc2240] (sibling chip). It is NOT confirmed to work on a
# TMC5240. Motion stays DISABLED until you set the line below to "yes",
# which means: "I know this is experimental and I will test at LOW current
# with motors disconnected from the machine first."
klipper_driver = tmc2240
tmc5240_risk_acknowledged = no

# SPI wiring from the Due to the drivers
#   hardware = Due hardware SPI0 (MISO=PA25, MOSI=PA26, SCK=PA27)
#   software = any 3 free pins (fill the 3 pins below)
spi_mode = hardware
spi_software_sclk_pin = UNSET
spi_software_mosi_pin = UNSET
spi_software_miso_pin = UNSET

microsteps = 16
# Sense/reference resistor on the driver board, in ohms (TMC2240/5240 default 12000)
rref = 12000

# ---------------------------------------------------------------------
# AXES.  Printer type: Cartesian. Lead-screw driven.
#   X axis = carries the extruder (lead screw)
#   Y axis = moves the whole X assembly front/back (lead screw)
#   Z axis = moves the bed up/down (lead screw)
# lead_mm = how far the nut moves per ONE motor revolution
#           (T8x8 = 8,  T8x4 = 4,  T8x2 = 2).  It is printed on the screw / datasheet.
# ---------------------------------------------------------------------
[axis_x]
step_pin = UNSET
dir_pin = UNSET
enable_pin = UNSET
cs_pin = UNSET                        # SPI chip-select of this driver
invert_dir = no                       # set to yes if the axis moves the wrong way
enable_active_low = yes               # yes for TMC drivers (normal)
lead_mm = UNSET                       # e.g. 8
motor_full_steps = 200                # 200 = 1.8 degree motor (normal NEMA17)
run_current = UNSET                   # amps RMS, e.g. 0.8
endstop_pin = UNSET                   # e.g. ^PC5   (^ = pull-up, ! = invert)
endstop_position = 0                  # coordinate of the endstop (0 if it is at the minimum end)
position_min = 0
position_max = UNSET                  # usable travel in mm = print area X
homing_speed = 15
max_rpm = 500                         # speed safety limit for the motor (keep 300-600)

[axis_y]
step_pin = UNSET
dir_pin = UNSET
enable_pin = UNSET
cs_pin = UNSET
invert_dir = no
enable_active_low = yes
lead_mm = UNSET
motor_full_steps = 200
run_current = UNSET
endstop_pin = UNSET
endstop_position = 0
position_min = 0
position_max = UNSET                  # print area Y
homing_speed = 15
max_rpm = 500

[axis_z]
step_pin = UNSET
dir_pin = UNSET
enable_pin = UNSET
cs_pin = UNSET
invert_dir = no
enable_active_low = yes
lead_mm = UNSET                       # warning: T8x8 on Z can let the bed sink when power is off
motor_full_steps = 200
run_current = UNSET
endstop_pin = UNSET
# Z=0 means nozzle touching the bed. If the Z sensor triggers when the bed is
# at the TOP (near the nozzle) keep endstop_position = 0 and Z moves "away"
# from the nozzle as the number grows.
endstop_position = 0
position_min = -2
position_max = UNSET                  # print height Z
homing_speed = 4
max_rpm = 150

# ---------------------------------------------------------------------
[extruder]                            # Bondtech LGX + Phaetus Rapido
step_pin = UNSET
dir_pin = UNSET
enable_pin = UNSET
cs_pin = UNSET
invert_dir = no
enable_active_low = yes
run_current = UNSET                   # amps RMS - check the LGX motor datasheet
# Filament mm per motor revolution. Look up the value for your exact LGX
# version in Bondtech's documentation, then fine-tune with the 100 mm test
# (see docs/COMMISSIONING.md).
rotation_distance = UNSET
nozzle_diameter = 0.4
filament_diameter = 1.75
pressure_advance = 0.0                # tune later; direct drive is often 0.03-0.06

# Rapido hotend
heater_pin = UNSET
sensor_type = UNSET                   # SET THIS CORRECTLY: the sensor shipped with your Rapido
                                      # (PT1000, "Generic 3950", ...). A wrong type can overheat the hotend.
sensor_pin = UNSET
max_temp = 285                        # hard safety limit (Rapido is rated higher; stay below)
min_extrude_temp = 170
# Starting PID values. After first heat-up run PID_CALIBRATE (docs/COMMISSIONING.md)
pid_kp = 22.2
pid_ki = 1.08
pid_kd = 114

# ---------------------------------------------------------------------
[bed]
has_heated_bed = no
heater_pin = UNSET
sensor_type = UNSET
sensor_pin = UNSET
max_temp = 110
pid_kp = 54.0
pid_ki = 0.8
pid_kd = 400

# ---------------------------------------------------------------------
[fans]
hotend_fan_pin = UNSET                # heatsink fan of the Rapido (turns on when hot)
part_fan_pin = UNSET                  # part-cooling fan (optional)

# ---------------------------------------------------------------------
[motion]
# Safe speed limits. The real X/Y speed limit is ALSO computed automatically:
#   lead_mm * max_rpm / 60   (e.g. T8x8 at 500 rpm = 66 mm/s)
max_velocity = 80
max_accel = 500
max_z_velocity = 8
max_z_accel = 50
idle_timeout_seconds = 1800

# ---------------------------------------------------------------------
[slicer]
# Used by the automatic slicer. Bed size comes from position_max above.
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
retract_length = 0.8                  # direct drive: 0.4 - 1.0
retract_speed = 35
retract_lift = 0.2

[material.PLA]
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
fan_speed = 100

[material.PETG]
temperature = 240
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 80
fan_speed = 40

# ---------------------------------------------------------------------
[autoslice]
port = 8088
default_material = PLA
# no  = slice, upload, then the customer presses PRINT in Mainsail (recommended for first prints)
# yes = slice and start printing immediately
auto_start_print = no
max_upload_mb = 300
